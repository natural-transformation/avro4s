name: Refresh dependency locks

on:
  workflow_dispatch:
  push:
    branches: [maintenance/dependencies-java21-java25]
    paths: ['flake.nix', 'flake.lock', 'project/**', 'build.sbt', 'default.nix', 'nix/**', 'scripts/refresh-dependency-locks.sh']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Refresh Nix packages
        run: nix flake update nixpkgs
      - name: Refresh resolved Maven locks through sbtix
        # Bootstrap the new classpath manifest with the last working Nix shell.
        # Restore the local shell after the generated manifest is checked in.
        run: nix develop github:natural-transformation/avro4s/99a71edb08c6668cbfb9bf826f889b6bfc1e179b#java21 --command bash scripts/refresh-dependency-locks.sh
      - name: Package lock changes for review
        if: always()
        run: |
          mkdir -p target/lock-refresh
          for file in sbt-bootstrap-repo.nix sbt-bootstrap-jars.json; do
            if [ -f "$file" ]; then git add --intent-to-add "$file"; fi
          done
          git diff --binary > target/lock-refresh/locks.patch
          git status --short > target/lock-refresh/status.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-lock-refresh
          path: target/lock-refresh/
