name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release version"
        default: '5.1.'
        required: true
      branch:
        description: "The branch to release from"
        required: true
        default: 'master'
  release:
    types: [published]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    uses: ./.github/workflows/java-validation.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  scala-3:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Determine release version
        id: set_version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # If triggered by workflow_dispatch, use the input 'version';
          # otherwise, derive version from the GitHub release tag, stripping any leading "v".
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_VERSION" ]; then
            echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Remove leading 'v' from tag, e.g., 'v5.1.2' becomes '5.1.2'
            TAG="$RELEASE_TAG"
            TAG="${TAG#v}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Install Nix (with flake support)
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: sandbox = true

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: avro4s
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          push: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}

      # Optional: Remove if confident in GPG import
      - name: Show GPG user IDs
        run: |
          echo "fingerprint: ${{ steps.import_gpg.outputs.fingerprint }}"
          echo "keyid:       ${{ steps.import_gpg.outputs.keyid }}"
          echo "name:        ${{ steps.import_gpg.outputs.name }}"
          echo "email:       ${{ steps.import_gpg.outputs.email }}"

      - name: Publish Signed Artifacts
        env:
          RELEASE_VERSION: ${{ steps.set_version.outputs.version }}
          # Release credentials (Sonatype Central / OSSRH Staging API Service).
          SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          SONATYPE_STAGING_USERNAME: ${{ secrets.SONATYPE_STAGING_USERNAME }}
          SONATYPE_STAGING_PASSWORD: ${{ secrets.SONATYPE_STAGING_PASSWORD }}
        run: nix develop --command sbt publishSigned

      - name: Sonatype Central Release
        env:
          RELEASE_VERSION: ${{ steps.set_version.outputs.version }}
          # Release credentials (Sonatype Central / OSSRH Staging API Service).
          SONATYPE_CENTRAL_USERNAME: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          SONATYPE_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          SONATYPE_STAGING_USERNAME: ${{ secrets.SONATYPE_STAGING_USERNAME }}
          SONATYPE_STAGING_PASSWORD: ${{ secrets.SONATYPE_STAGING_PASSWORD }}
        run: nix develop --command sbt sonatypeCentralRelease
