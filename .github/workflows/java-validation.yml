name: Java compatibility and dependency audit

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Test, smoke benchmarks and verify Java 21 bytecode
        env:
          SBT_BOOT: ${{ runner.temp }}/sbt-boot
        run: nix develop .#java${{ matrix.java }} --command bash scripts/ci-validate.sh
      - name: Audit resolved runtime, test, benchmark and build dependencies
        if: ${{ !cancelled() }}
        env:
          SBT_BOOT: ${{ runner.temp }}/sbt-boot
        run: nix develop .#java${{ matrix.java }} --command bash scripts/dependency-audit.sh
      - name: Verify offline Nix build
        if: matrix.java == '21'
        run: nix build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-${{ matrix.java }}-validation
          path: |
            target/dependency-audit/
            **/target/test-reports/
